name: kylin-tars-vm
channels:
  - conda-forge
  - defaults
dependencies:
  # Python 基础环境
  - python=3.10
  
  # 系统库依赖（通过conda安装）
  - dbus-python=1.3.2
  - pygobject=3.54.5
  
  # 基础工具
  - pip
  - setuptools
  - wheel
  
  # pip 安装的 Python 包
  - pip:
      # Web UI 框架
      - gradio==6.0.2
      - gradio-client==2.0.1
      
      # 系统监控和进程管理
      - psutil==7.1.3
      
      # HTTP 请求
      - requests==2.31.0
      - httpx==0.28.1
      
      # 数据处理
      - numpy==1.26.4
      - pandas==2.2.2
      
      # 可视化（记忆轨迹图）
      - matplotlib==3.9.2
      - networkx==3.3
      - pillow==11.3.0
      
      # JSON 处理
      - orjson==3.11.5
      
      # 日志和工具
      - python-json-logger==4.0.0
      - loguru==0.7.3
      
      # OpenAI API 兼容（用于调用UITARS API）
      - openai==2.8.1
      
      # 其他工具
      - python-dateutil==2.9.0.post0
      - tqdm==4.67.1
      - pyyaml==6.0.1
      
      # 字符串匹配（用于记忆检索）
      - fuzzywuzzy==0.18.0
      - python-levenshtein==0.27.3
      - rapidfuzz==3.14.3

